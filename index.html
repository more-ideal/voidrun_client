<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VOIDRUN</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #111318;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game canvas { display: block; }

    /* 점수 패널 - 화면 오른쪽에 fixed */
    #ui-panel {
      position: fixed;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      display: none;
      flex-direction: column;
      gap: 4px;
      background: none;
      padding: 0;
    }

    #ui-panel.visible { display: flex; }

    .ui-label {
      font-family: monospace;
      font-size: 11px;
      color: #7799aa;
      letter-spacing: 2px;
    }

    .ui-value {
      font-family: monospace;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    #ui-score  { color: #00e5cc; }
    #ui-height { color: #f5a623; }

    .ui-divider {
      height: 1px;
      background: #1a3a5c;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="ui-panel">
    <div class="ui-label">SCORE</div>
    <div class="ui-value" id="ui-score">0</div>
    <div class="ui-divider"></div>
    <div class="ui-label">HEIGHT</div>
    <div class="ui-value" id="ui-height">0m</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
